settings:
  print_preferences:
    items:
      dock_monitor:
        label: Toolhead Dock Monitor
        description: Pauses the print if a parked toolhead leaves its dock, or the active toolhead leaves the carriage, for 7 seconds between tool changes.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/dock_monitor
        get_cmd:
          - bash
          - -c
          - test -e /oem/printer_data/config/extended/klipper/dock_monitor.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/dock_monitor.cfg /oem/printer_data/config/extended/klipper/dock_monitor.cfg &&
                echo "Dock monitor enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/dock_monitor.cfg &&
                echo "Dock monitor disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
