# Toolhead dock monitor: during a print, every parked toolhead must stay
# PARKED and the active toolhead must stay on the carriage. A mismatch that
# lasts trigger_time seconds (outside tool changes) pauses the print with an
# on-screen error, e.g. "Toolhead 3 undocked while idle, pausing print!".
# See /home/lava/klipper/klippy/extras/dock_monitor.py for all options.

[dock_monitor]
#trigger_time: 7.0
#check_interval: 0.1
#switch_grace_time: 1.5
#check_active: True
#ignore_extruders:
#ignore_simulated: True
