# Toolhead dock monitor: during a print, every parked toolhead must stay
# PARKED and the active toolhead must stay grabbed. On a sustained mismatch
# (trigger_count x check_interval) the print is paused.
# See /home/lava/klipper/klippy/extras/dock_monitor.py for all options.

[dock_monitor]
action: pause
#check_interval: 0.1
#trigger_count: 5
#switch_grace_time: 1.5
#check_active: True
#ignore_extruders:
#ignore_simulated: True
